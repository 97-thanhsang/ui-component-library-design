image: node:22-bookworm-slim

stages:
  - verify

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

before_script:
  - corepack enable
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile

verify:
  stage: verify
  script:
    - pnpm run typecheck
    - pnpm run format:check
    - pnpm run build
